[project]
name = "gpu-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AI DEV", email = "me@code.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "mistralai>=3.1.0",
    "playwright>=1.63.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
gpu-scraper = "gpu_scraper:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
